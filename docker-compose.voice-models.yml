# Optional GPU voice workers: Chatterbox, Qwen3, Fish Audio S2 and Breeze TTS 2. Each one is off by default:
# it has a Compose profile of its own, named after it, so layering this file builds and starts none of them,
# and the core (Kokoro, faster-whisper, Piper, Pocket-TTS) runs as before. Turn one on by naming its
# profile on the base and GPU files, here --profile qwen3 (or --profile chatterbox, --profile fish, --profile breeze):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.voice-models.yml --profile qwen3 up -d --build
# For two, repeat it (--profile qwen3 --profile chatterbox); --profile "*" turns on all four.
# COMPOSE_PROFILES=qwen3,chatterbox (in the shell or in .env) does the same as the flags, and also
# covers later commands such as `down`. Only Qwen3 Custom Voice has built-in voices; the other
# models (Chatterbox, Qwen3 Base, Fish Audio S2, Breeze TTS 2) clone from a recording, and Breeze TTS 2
# and Qwen3 VoiceDesign design a voice from a description.
# The core knows all four workers; one that isn't turned on reads "Worker offline" in Models.
# It reaches each by a network alias under voice-workers.internal (qwen3.voice-workers.internal and
# so on), written with a trailing dot, not by the bare service name: with a worker's profile off, no
# container holds its name, and Docker's DNS asks the host's DNS servers instead, where a device on
# the LAN called "chatterbox" would answer and be taken for the worker. A home router registers a
# DHCP name bare and under its own domain (chatterbox.lan), not as chatterbox.voice-workers.internal,
# and the public DNS has no .internal; the trailing dot stops the search domains being appended.
# A running worker does not load model weights onto the GPU. An explicit load (Models, or
# POST /api/models/{id}/load) unloads the other TTS models first; see "Model residency" in docs/MODELS.md.
# This file replaces the older standalone docker-compose.qwen3.yml. Each worker builds from
# providers/ so it can copy the shared providers/_common scaffolding.
services:
  open-speech:
    environment:
      - TTS_EXTERNAL_PROVIDERS={"qwen3":"http://qwen3.voice-workers.internal.:8200","chatterbox":"http://chatterbox.voice-workers.internal.:8210","fish":"http://fish.voice-workers.internal.:8230","breeze":"http://breeze.voice-workers.internal.:8240"}

  chatterbox:
    profiles: [chatterbox]
    networks:
      default:
        aliases: [chatterbox.voice-workers.internal]
    build:
      context: providers
      dockerfile: chatterbox/Dockerfile
      args:
        REVISION: ${OPEN_SPEECH_REVISION:-unknown}
    image: ${OPEN_SPEECH_CHATTERBOX_IMAGE:-open-speech-chatterbox:0.2.1}
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
      - CHATTERBOX_MAX_REFERENCE_MB=${OS_MAX_UPLOAD_MB:-${STT_MAX_UPLOAD_MB:-100}}
      - CHATTERBOX_MAX_INPUT_CHARS=${CHATTERBOX_MAX_INPUT_CHARS:-350}
      - CHATTERBOX_RESTART_AFTER_UNLOAD_S=${CHATTERBOX_RESTART_AFTER_UNLOAD_S:-10}
      - CHATTERBOX_REFERENCE_CACHE_SIZE=${CHATTERBOX_REFERENCE_CACHE_SIZE:-8}
    volumes:
      - chatterbox-hf-cache:/home/chatterbox/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8210/health',timeout=3)); assert data['provider']=='chatterbox' and data['status']=='ok'\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  qwen3:
    profiles: [qwen3]
    networks:
      default:
        aliases: [qwen3.voice-workers.internal]
    build:
      context: providers
      dockerfile: qwen3/Dockerfile
      args:
        REVISION: ${OPEN_SPEECH_REVISION:-unknown}
    image: ${OPEN_SPEECH_QWEN3_IMAGE:-open-speech-qwen3:0.3.0}
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
      - QWEN3_MAX_REFERENCE_MB=${OS_MAX_UPLOAD_MB:-${STT_MAX_UPLOAD_MB:-100}}
      - QWEN3_MAX_SEGMENT_UNITS=${QWEN3_MAX_SEGMENT_UNITS:-400}
      - QWEN3_MAX_NEW_TOKENS_CEILING=${QWEN3_MAX_NEW_TOKENS_CEILING:-1200}
      - QWEN3_PROMPT_CACHE_SIZE=${QWEN3_PROMPT_CACHE_SIZE:-8}
      - QWEN3_STREAM_QUEUE_TIMEOUT_S=${QWEN3_STREAM_QUEUE_TIMEOUT_S:-30}
      - QWEN3_DTYPE=${QWEN3_DTYPE:-auto}
      # The worker hides the Base models (qwen3/0.6b-base, qwen3/1.7b-base) unless this is true; this bundle turns it on.
      - QWEN3_ENABLE_BASE=${QWEN3_ENABLE_BASE:-true}
    volumes:
      - qwen3-hf-cache:/home/qwenworker/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8200/health',timeout=3)); assert data['provider']=='qwen3' and data['status']=='ok'\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Fish Audio S2 Pro through the NF4 fork of fish-speech (about 3.3 GB of VRAM). Its first load fetches about
  # 5.0 GB of weights into fish-hf-cache and compiles for a few minutes (the compile cache is kept in
  # fish-compile-cache); FISH_COMPILE=false skips the compile on a GPU where it fails.
  fish:
    profiles: [fish]
    networks:
      default:
        aliases: [fish.voice-workers.internal]
    build:
      context: providers
      dockerfile: fish/Dockerfile
      args:
        REVISION: ${OPEN_SPEECH_REVISION:-unknown}
    image: ${OPEN_SPEECH_FISH_IMAGE:-open-speech-fish:0.1.0}
    restart: unless-stopped
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
      - FISH_MAX_REFERENCE_MB=${OS_MAX_UPLOAD_MB:-${STT_MAX_UPLOAD_MB:-100}}
      - FISH_MAX_INPUT_CHARS=${FISH_MAX_INPUT_CHARS:-1500}
      - FISH_SEGMENT_CHARS=${FISH_SEGMENT_CHARS:-300}
      - FISH_MAX_REFERENCE_SECONDS=${FISH_MAX_REFERENCE_SECONDS:-30}
      - FISH_COMPILE=${FISH_COMPILE:-true}
      - FISH_MAX_SEQ_LEN=${FISH_MAX_SEQ_LEN:-2048}
      - FISH_REFERENCE_CACHE_SIZE=${FISH_REFERENCE_CACHE_SIZE:-8}
      - FISH_TEMPERATURE=${FISH_TEMPERATURE:-0.7}
      - FISH_TOP_P=${FISH_TOP_P:-0.7}
      - FISH_SEED=${FISH_SEED:-42}
      - FISH_RESTART_AFTER_UNLOAD_S=${FISH_RESTART_AFTER_UNLOAD_S:-1}
      # Read by the fork itself: token embeddings stay in host RAM, and the codec decodes 64 frames at a time.
      - FISH_OFFLOAD_EMBEDDINGS=${FISH_OFFLOAD_EMBEDDINGS:-1}
      - FISH_DECODE_CHUNK_FRAMES=${FISH_DECODE_CHUNK_FRAMES:-64}
    volumes:
      - fish-hf-cache:/home/fishworker/.cache/huggingface
      - fish-compile-cache:/home/fishworker/.cache/torch
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8230/health',timeout=3)); assert data['provider']=='fish' and data['status']=='ok'\" || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Breeze TTS 2 through its C++ port with Q8_0 weights (about 4.4 GB of VRAM): voices designed from a
  # description, and cloning. Its first load fetches about 3.6 GB of weights into breeze-hf-cache. The worker runs
  # the port's server as a child process while the model is loaded and stops it on an unload, which frees the GPU.
  breeze:
    profiles: [breeze]
    networks:
      default:
        aliases: [breeze.voice-workers.internal]
    build:
      context: providers
      dockerfile: breeze/Dockerfile
      args:
        REVISION: ${OPEN_SPEECH_REVISION:-unknown}
    image: ${OPEN_SPEECH_BREEZE_IMAGE:-open-speech-breeze:0.1.0}
    restart: unless-stopped
    init: true
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN:-}
      - BREEZE_MAX_REFERENCE_MB=${OS_MAX_UPLOAD_MB:-${STT_MAX_UPLOAD_MB:-100}}
      - BREEZE_MAX_INPUT_CHARS=${BREEZE_MAX_INPUT_CHARS:-4096}
      - BREEZE_MAX_REFERENCE_SECONDS=${BREEZE_MAX_REFERENCE_SECONDS:-30}
      - BREEZE_DESIGN_CFG=${BREEZE_DESIGN_CFG:-3.0}
      - BREEZE_CLONE_CFG=${BREEZE_CLONE_CFG:-1.0}
      - BREEZE_CUE_CFG=${BREEZE_CUE_CFG:-2.5}
      - BREEZE_SEED=${BREEZE_SEED:-42}
      - BREEZE_TEXT_ENCODER_CPU=${BREEZE_TEXT_ENCODER_CPU:-false}
    volumes:
      - breeze-hf-cache:/home/breezeworker/.cache/huggingface
      - breeze-cuda-cache:/home/breezeworker/.nv/ComputeCache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8240/health',timeout=5)); assert data['provider']=='breeze' and data['status']=='ok'\" || exit 1",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s

volumes:
  chatterbox-hf-cache:
  qwen3-hf-cache:
  fish-hf-cache:
  fish-compile-cache:
  breeze-hf-cache:
  breeze-cuda-cache:
