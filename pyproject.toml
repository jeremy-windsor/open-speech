[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-speech"
version = "0.8.0"
description = "Self-hosted speech-model harness with OpenAI-compatible APIs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jeremy Windsor" }]

dependencies = [
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",
    "websockets==16.0",
    "python-multipart==0.0.22",
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "noisereduce==3.0.3",
    "huggingface-hub==1.13.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "onnxruntime==1.24.1",
    "numpy==2.4.1",
    "scipy==1.17.0",
    "librosa==0.11.0",
    "numba==0.66.0",
    "pyyaml==6.0.3",
    "wyoming==1.8.0",
]

[project.optional-dependencies]
tts = [
    "kokoro==0.9.4",
    "misaki[ja,zh]==0.9.4",
    "unidic-lite==1.0.8",
    "transformers==5.2.0",
    "en-core-web-sm",
]
piper = ["piper-tts==1.8.0"]
pocket = ["pocket-tts==3.1.0"]
cpu = ["torch==2.10.0"]
cuda = ["torch==2.10.0"]
diarize = ["pyannote.audio>=3.0"]
noise = ["noisereduce>=3.0"]
client = ["httpx>=0.27.0", "websockets>=12.0"]
examples = ["sounddevice>=0.5.0"]
all = [
    "open-speech[tts,piper,pocket]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/jeremy-windsor/open-speech"
Repository = "https://github.com/jeremy-windsor/open-speech"
Documentation = "https://github.com/jeremy-windsor/open-speech#readme"
"Bug Tracker" = "https://github.com/jeremy-windsor/open-speech/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
