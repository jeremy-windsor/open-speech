# CPU profile: the base docker-compose.yml service (same CPU image, ports, and volumes) with
# smaller defaults: the base faster-whisper STT model, Wyoming off and bound to 127.0.0.1,
# and no cap on loaded models. Launch on its own:
#   docker compose -f docker-compose.cpu.yml up -d
services:
  open-speech:
    extends:
      file: docker-compose.yml
      service: open-speech
    environment:
      - STT_MODEL=${STT_MODEL:-Systran/faster-whisper-base}
      - OS_WYOMING_ENABLED=${OS_WYOMING_ENABLED:-false}
      - OS_WYOMING_HOST=${OS_WYOMING_HOST:-127.0.0.1}
      - OS_MAX_LOADED_MODELS=${OS_MAX_LOADED_MODELS:-0}

volumes:
  hf-cache:
  vad-cache:
  ssl-certs:
  tts-cache:
